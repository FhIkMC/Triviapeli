<html>
    <head>
        <title>Trivial pursuit peli</title>
        <link rel="stylesheet" href="styles.css">
        <script scr="game.js"></script>
    </head>
    <body>
        <header class="game-header">
            <h1>Trivia peli</h1>
            <p>Kerää kaikki kategoriat</p>
        </header>

        <section class="status-panel">
            <article class="player-card">
                <h2>Player</h2>
                <img src="good.png" class="player-image">
                <p>Kerätyt aihealueet: 0/6</p>
            </article>

            <article class="dice-panel">
                <p>In Turn:</p>
                <h2>Player</h2>
                <button>Roll The Dice</button>

                <div id="board" class="board">Pelilauta</div>
            </article>


            <article class="player-card">
                <h2>Opponent</h2>
                <img src="bad.png" class="player-image">
                <p>Kerätyt aihealueet: 0/6</p>
            </article>
        </section>
    </body>
</html>
